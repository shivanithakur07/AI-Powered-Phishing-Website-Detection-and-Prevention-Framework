version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      # - URLHAUS_API_KEY=your_key_here
      # - VT_API_KEY=your_key_here
    volumes:
      - ./data:/app/data
      - ./database.db:/app/database.db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
